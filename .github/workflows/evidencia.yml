name: Evidencia mensual del asesor

on:
  schedule:
    # El día 2 de cada mes: con el cierre del mes anterior ya guardado. Minuto impar porque GitHub atrasa los cron
    # a la hora en punto
    - cron: '23 9 2 * *'
  workflow_dispatch:

# Necesita escribir en el repo: guarda el resultado en web/src/data/evidencia.json y eso despliega la web
permissions:
  contents: write

concurrency:
  group: evidencia
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Medir las señales del asesor con 10 años de precios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # La SEC exige un correo de contacto para entregar los estados financieros (fundamentales de EE.UU.)
          SEC_CONTACTO: ${{ secrets.SEC_CONTACTO }}
        run: python evidencia.py --salida web/src/data/evidencia.json

      - name: Guardar el resultado
        run: |
          git config user.name "Sebas7w7"
          git config user.email "247446013+Sebas7w7@users.noreply.github.com"
          git add web/src/data/evidencia.json
          if git diff --cached --quiet; then
            echo "La evidencia no cambió."
            exit 0
          fi
          git commit -m "Refresh the advisor's measured evidence with last month's prices"
          git push
